name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The suite includes the replay-hash determinism tests (run-twice-compare),
      # the Phase 0 exit proof that the same seed + inputs give identical worlds.
      - run: pnpm test
      - run: pnpm build
