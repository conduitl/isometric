name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The suite includes the replay-hash determinism tests (run-twice-compare),
      # the Phase 0 exit proof that the same seed + inputs give identical worlds.
      - run: pnpm test
      # Docs build is a RELEASE gate, not a merge gate (docs/DECISIONS.md R9)
      # — it runs in .github/workflows/release.yml.
      - run: pnpm -r --filter '!docs' run build
      # Phase 2 e2e gates (apps/editor/e2e): the keyboard-only build-save-reload
      # flow and the axe-core accessibility scan. Playwright boots its own dev
      # server; only its pinned Chromium needs installing here.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      # Perf + visual gates run on the pinned local reference profile, NOT here —
      # shared-runner timing is noise. That covers pnpm perf (Phase 1) and
      # pnpm perf:editor + pnpm test:visual (Phase 2); the visual baselines are
      # blessed on the pinned local Chromium (linux CI baselines remain a
      # recorded chore). See docs/DECISIONS.md R10/R11.
      # The docs build runs at RELEASE (pnpm docs:build in
      # .github/workflows/release.yml), not per merge — R9. It compiles the
      # live demos against the real @engine/* sources, so a release with a
      # broken engine or broken docs cannot ship; a Starlight hiccup
      # meanwhile never blocks an engine merge (hence '!docs' above).
