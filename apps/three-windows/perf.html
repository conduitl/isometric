<!doctype html>
<!--
  The perf page: one canvas, no controls, no chrome. Everything interesting
  happens in src/perf.ts, which renders the red-team killer scene (a 256×256
  layer, fully zoomed out) in a rAF loop, measures its own frame deltas, and
  publishes the verdict on globalThis.__perfResult for the harness at
  scripts/perf/tilemap-budget.mjs to read. Keeping the page this bare is the
  point — the budget should measure the engine, not a UI.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tilemap perf scene — 256×256, fully zoomed out</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d131e;
        overflow: hidden;
      }
      #perf-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="perf-canvas"></canvas>
    <script type="module" src="/src/perf.ts"></script>
  </body>
</html>
