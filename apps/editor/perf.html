<!doctype html>
<!--
  The editor's perf page: one canvas, no React, no panels. Everything
  interesting happens in src/perf.ts, which assembles a REAL editor session
  (bus, tools door, scene renderer, viewport — the same machine main.tsx
  boots), loads the 256×256 drag-paint arena, and runs a scripted drag-paint
  through bus.beginTileStroke while measuring its own rAF-timestamp deltas.
  The verdict lands on globalThis.__perfResult for the harness at
  scripts/perf/editor-paint-budget.mjs to read. Keeping the page this bare is
  the point — the budget should measure EDITING, not React chrome.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editor drag-paint perf scene — 256×256 arena</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d131e;
        overflow: hidden;
      }
      #perf-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="perf-canvas"></canvas>
    <script type="module" src="/src/perf.ts"></script>
  </body>
</html>
